server {
    listen 80;
    server_name vaccine-news.com www.vaccine-news.com;

    # 1. ACME Challenge (for Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 2. Weather API Proxy (Fix for "Weather Info Not Found")
    location /1360000/ {
        proxy_pass https://apis.data.go.kr/1360000/;
        proxy_ssl_server_name on;
    }

    # 3. Main React App
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
