version: "3.8"

services:
  # 1. PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: finalproject_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - finalproject_network

  # 2. Adminer
  adminer:
    image: adminer
    container_name: finalproject_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - finalproject_network

  # 3. Redis
  redis:
    image: redis:alpine
    container_name: finalproject_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - finalproject_network

  # 3. Backend (FastAPI)
  backend:
    build: ./backend
    container_name: finalproject_backend
    restart: always
    # .env 파일 위치 확인 (최상위에 있다면 그대로 유지)
    env_file: .env 
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    
    # 1번 수정 포인트: 볼륨 추가 (데이터 영구 보존)
    volumes:
      - ./backend/chroma_db:/app/backend/chroma_db
    
    # 2번 수정 포인트: 작업 디렉토리 명시 (경로 꼬임 방지)
    working_dir: /app
    
    ports:
      - "8081:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - finalproject_network


  # 5. Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      args:
        # .env의 SERVER_IP를 사용하여 빌드 타임에 주입
        REACT_APP_API_URL: http://${SERVER_IP}:8081
    container_name: finalproject_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - finalproject_network

networks:
  finalproject_network:
    driver: bridge

volumes:
  postgres_data: