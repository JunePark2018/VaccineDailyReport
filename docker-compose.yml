version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finalproject_postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: finalproject
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: finalproject_redis
    restart: always
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    container_name: finalproject_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
