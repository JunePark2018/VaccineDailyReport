version: '3.8'

services:
  # 1. 데이터베이스: PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: finalproject_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-myuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mypassword}
      - POSTGRES_DB=${POSTGRES_DB:-mydb}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - finalproject_network

  # 2. DB 관리 도구: Adminer
  adminer:
    image: adminer
    container_name: finalproject_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - finalproject_network

  # 3. 백엔드: FastAPI
  backend:
    build: ./backend
    container_name: finalproject_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@postgres:5432/${POSTGRES_DB:-mydb}
    ports:
      - "8081:8000"
    depends_on:
      - postgres
    networks:
      - finalproject_network

  # 4. 프론트엔드: Nginx (빌드 시 IP 주입)
  frontend:
    build: 
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://168.107.51.224:8081
    container_name: finalproject_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - finalproject_network

networks:
  finalproject_network:
    name: finalproject_network
    driver: bridge

volumes:
  postgres_data:
