version: "3.8"

services:
  # 1. PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: finalproject_postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - finalproject_network

  # 2. Adminer
  adminer:
    image: adminer
    container_name: finalproject_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - finalproject_network

  # 3. Backend (FastAPI)
  backend:
    build: ./backend
    container_name: finalproject_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydb
    ports:
      - "8081:8000"
    depends_on:
      - postgres
    networks:
      - finalproject_network

  # 4. Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://backend:8000
    container_name: finalproject_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - finalproject_network

networks:
  finalproject_network:
    driver: bridge

volumes:
  postgres_data: